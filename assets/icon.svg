  <circle cx="64" cy="64" r="29" fill="none" stroke="#ffffff" stroke-width="7.7"/>
  <circle cx="64" cy="64" r="7.7" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="7.7" stroke-linecap="round">
    <line x1="64" y1="19.6" x2="64" y2="-6"/>
    <line x1="64" y1="108.4" x2="64" y2="134"/>
    <line x1="19.6" y1="64" x2="-6" y2="64"/>
    <line x1="108.4" y1="64" x2="134" y2="64"/>
  </g>
</svg>
